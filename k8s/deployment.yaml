apiVersion: apps/v1
kind: Deployment
metadata:
  name: proyecto
  namespace: grupo22
spec:
  replicas: 2
  selector:
    matchLabels:
      app: proyecto
  template:
    metadata:
      labels:
        app: proyecto
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: proyecto
          image: ghcr.io/julianasolanx/proyecto-desarrollo-web:latest
          ports:
            - containerPort: 8080
          envFrom:                        # ← ESTO ES LO QUE SE AGREGA
            - configMapRef:
                name: app-config         
---
apiVersion: v1
kind: Service
metadata:
  name: proyecto
  namespace: grupo22
spec:
  selector:
    app: proyecto
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP